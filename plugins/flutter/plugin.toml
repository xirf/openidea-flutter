id = "xirf.flutter"
name = "Flutter"
version = "0.1.0"
description = "Flutter IDE support ported from flutter-intellij: closing labels, Material/Cupertino color & icon previews/completion/hover, Extract Widget & wrap/unwrap/Stateful conversions, flutter test --machine tree, build targets, emulator launcher, Flutter tools view, FVM/SDK settings, snippets, and MCP tools."
authors = ["xirf"]
homepage = "https://github.com/xirf/openidea-flutter"
license = "Apache-2.0"
change-notes = "0.1.0 — initial port of Flutter IntelliJ tooling for OpenIDEA: closing labels, widget refactorings, Material/Cupertino colors & icons, flutter test JSON runner, build targets, emulator launcher, Flutter tool window, snippets, file templates, and MCP tools."
categories = ["frameworks", "tools"]
icon = "icons/flutter.svg"
icon-dark = "icons/flutter_dark.svg"
engines.openidea = "^1.12"
wasm = "dist/plugin.wasm"
activation = [
    "on-language:dart",
    "on-file:pubspec.yaml",
    "on-command:*",
    "on-view:flutter-tools",
    "on-event:file-saved",
]

[[depends]]
id = "xirf.dart"
version = "^0.1"

[[contributes."xirf.dart.tools"]]
id = "flutter-pub-get"
title = "Flutter: Pub Get"
command = "pub-get"
description = "Fetch Flutter packages via flutter pub get"

[[contributes."xirf.dart.tools"]]
id = "flutter-doctor"
title = "Flutter: Run Flutter Doctor"
command = "doctor"
description = "Inspect installed Flutter, Android, iOS, and desktop toolchains"

[capabilities]
required = [
    "project.read",
    "editor.read",
    "editor.write",
    "events",
    "process:flutter",
]
optional = [
    "process:fvm",
]

