[[contributes.keymaps]]
command = "extract-widget"
key = "Ctrl+Alt+W"
mac = "Meta+Alt+W"

[[contributes.keymaps]]
command = "doctor"
key = "Ctrl+Alt+D"
mac = "Meta+Alt+D"

[[contributes.statusBar]]
id = "flutter-status"
text = "Flutter"
tooltip = "Run Flutter Doctor"
command = "doctor"
align = "right"
priority = 210

[contributes.settings]
title = "Flutter"

[[contributes.settings.pages]]
id = "sdk"
title = "SDK & Builds"
schema = "settings/sdk.schema.json"
actions = [
    { title = "Run Flutter Doctor", command = "doctor" },
    { title = "Flutter Pub Get", command = "pub-get" },
]

[[contributes.settings.pages]]
id = "editor"
title = "Editor & Widgets"
schema = "settings/editor.schema.json"

[[contributes.views]]
id = "flutter-tools"
title = "Flutter"
icon = "icons/flutter.svg"
location = "right"

[[contributes.providers]]
kinds = [
    "completion",
    "code-actions",
    "definition",
    "line-markers",
    "semantic-tokens",
    "inlay-hints",
    "hover",
    "diagnostics",
    "document-links",
    "code-lenses",
    "colors",
    "gutter-actions",
]
languages = ["dart", "yaml"]

[[contributes.runConfigurations]]
files = ["pubspec.yaml"]

[[contributes.snippets]]
language = "dart"
path = "snippets/flutter.json"

[[contributes.fileTemplates]]
id = "stateless-widget"
name = "Flutter StatelessWidget"
extension = "dart"
path = "templates/stateless_widget.dart"

[[contributes.fileTemplates]]
id = "stateful-widget"
name = "Flutter StatefulWidget"
extension = "dart"
path = "templates/stateful_widget.dart"

[[contributes.fileTemplates]]
id = "widget-test"
name = "Flutter Widget Test"
extension = "dart"
path = "templates/widget_test.dart"

[[contributes.markerIcons]]
id = "flutter-widget"
icon = "icons/widget.svg"

[[contributes.mcpTools]]
name = "flutter_doctor"
description = "Runs `flutter doctor` and returns structured toolchain status sections."
inputSchema = "mcp/flutter_doctor.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "flutter_devices"
description = "Runs `flutter devices --machine` and returns connected devices and emulators."
inputSchema = "mcp/flutter_devices.schema.json"
readOnly = true
destructive = false
